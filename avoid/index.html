<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avoid</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050712;
      color: #f8fbff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 48% 18%, rgba(72, 156, 220, 0.16), transparent 28rem),
        linear-gradient(180deg, #070a17 0%, #03040a 100%);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      display: grid;
      gap: 6px;
      min-width: 230px;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .time {
      font-size: 24px;
      font-weight: 750;
      line-height: 1;
    }

    .level {
      color: #bfeaff;
      font-size: 18px;
      font-weight: 700;
    }

    .slow-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .gauge {
      width: 210px;
      height: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
    }

    .fill {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, #7ce9ff, #fff16b);
      box-shadow: 0 0 18px rgba(124, 233, 255, 0.55);
    }

    .slow-label {
      color: #c9f5ff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .help {
      position: fixed;
      right: 18px;
      bottom: 16px;
      color: rgba(245, 250, 255, 0.72);
      font-size: 14px;
      font-weight: 650;
      pointer-events: none;
      text-align: right;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
    }

    .center {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: none;
      text-align: center;
    }

    .message {
      white-space: pre-line;
      color: white;
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 850;
      line-height: 1.25;
      text-shadow: 0 6px 26px rgba(0, 0, 0, 0.78);
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Avoid bullet hell game"></canvas>
  <div class="hud">
    <div id="time" class="time">Time 00:00</div>
    <div id="level" class="level">Level 1</div>
    <div class="slow-row">
      <div class="gauge"><div id="slowFill" class="fill"></div></div>
      <div class="slow-label">SLOW</div>
    </div>
  </div>
  <div class="help">Arrow keys move<br>Hold Space to slow time<br>R restarts</div>
  <div class="center"><div id="message" class="message"></div></div>

  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const timeLabel = document.getElementById("time");
    const levelLabel = document.getElementById("level");
    const slowFill = document.getElementById("slowFill");
    const message = document.getElementById("message");

    const keys = new Set();
    const bullets = [];
    const stars = [];
    const player = {
      x: 0,
      y: 0,
      radius: 13,
      speed: 360,
      tilt: 0
    };

    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastTime = performance.now();
    let elapsed = 0;
    let slowEnergy = 1;
    let edgeTimer = 0;
    let ringTimer = 1.8;
    let spiralTimer = 0.2;
    let spiralAngle = 0;
    let gameOver = false;

    const difficultyStepSeconds = 30;
    const slowMaxSeconds = 1;
    const slowScale = 0.28;
    const slowRechargePerSecond = 0.38;

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
        event.preventDefault();
      }

      keys.add(event.code);
      if (gameOver && event.code === "KeyR") {
        resetGame();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    window.addEventListener("resize", resize);

    function resize() {
      dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (stars.length === 0) {
        createStars();
      }
      player.x = clamp(player.x || width / 2, player.radius, width - player.radius);
      player.y = clamp(player.y || height * 0.72, player.radius, height - player.radius);
    }

    function createStars() {
      for (let index = 0; index < 110; index += 1) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 0.8 + Math.random() * 2.2,
          speed: 18 + Math.random() * 66,
          alpha: 0.25 + Math.random() * 0.62
        });
      }
    }

    function resetGame() {
      bullets.length = 0;
      elapsed = 0;
      slowEnergy = slowMaxSeconds;
      edgeTimer = 0;
      ringTimer = 1.8;
      spiralTimer = 0.2;
      spiralAngle = 0;
      gameOver = false;
      player.x = width / 2;
      player.y = height * 0.72;
      player.tilt = 0;
      message.textContent = "";
    }

    function frame(now) {
      const realDelta = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      if (!gameOver) {
        const wantsSlow = keys.has("Space") && slowEnergy > 0;
        const gameDelta = realDelta * (wantsSlow ? slowScale : 1);
        elapsed += realDelta;
        updateSlowEnergy(realDelta, wantsSlow);
        movePlayer(realDelta);
        updateSpawners(gameDelta);
        updateBullets(gameDelta);
        updateHud();
      }

      updateStars(realDelta);
      draw(wantsSlowActive());
      requestAnimationFrame(frame);
    }

    function wantsSlowActive() {
      return !gameOver && keys.has("Space") && slowEnergy > 0;
    }

    function updateSlowEnergy(realDelta, wantsSlow) {
      if (wantsSlow) {
        slowEnergy = Math.max(0, slowEnergy - realDelta);
      } else {
        slowEnergy = Math.min(slowMaxSeconds, slowEnergy + realDelta * slowRechargePerSecond);
      }
    }

    function movePlayer(realDelta) {
      const dx = readAxis("ArrowLeft", "ArrowRight");
      const dy = readAxis("ArrowUp", "ArrowDown");
      const length = Math.hypot(dx, dy) || 1;
      const normalizedX = dx / length;
      const normalizedY = dy / length;
      const moving = dx !== 0 || dy !== 0;
      const speed = moving ? player.speed : 0;

      player.x = clamp(player.x + normalizedX * speed * realDelta, player.radius, width - player.radius);
      player.y = clamp(player.y + normalizedY * speed * realDelta, player.radius, height - player.radius);
      player.tilt += ((moving ? -normalizedX * 0.32 : 0) - player.tilt) * Math.min(1, realDelta * 12);
    }

    function updateSpawners(gameDelta) {
      const step = difficultyStep();
      const edgeInterval = Math.max(0.09, 0.42 - step * 0.045);
      const edgeShots = Math.min(1 + Math.floor(step / 2), 5);

      edgeTimer -= gameDelta;
      while (edgeTimer <= 0) {
        edgeTimer += edgeInterval;
        for (let index = 0; index < edgeShots; index += 1) {
          spawnEdgeBullet(step);
        }
      }

      if (step >= 1) {
        ringTimer -= gameDelta;
        if (ringTimer <= 0) {
          ringTimer = Math.max(1.05, 2.4 - step * 0.18);
          spawnRing(step);
        }
      }

      if (step >= 2) {
        spiralTimer -= gameDelta;
        if (spiralTimer <= 0) {
          spiralTimer = Math.max(0.08, 0.18 - step * 0.01);
          spawnSpiral(step);
        }
      }
    }

    function spawnEdgeBullet(step) {
      const margin = 40;
      const side = Math.floor(Math.random() * 4);
      let x = 0;
      let y = 0;

      if (side === 0) {
        x = -margin;
        y = Math.random() * height;
      } else if (side === 1) {
        x = width + margin;
        y = Math.random() * height;
      } else if (side === 2) {
        x = Math.random() * width;
        y = -margin;
      } else {
        x = Math.random() * width;
        y = height + margin;
      }

      const scatter = Math.max(8, 44 - step * 5);
      const targetX = player.x + randomRange(-scatter, scatter);
      const targetY = player.y + randomRange(-scatter, scatter);
      const angle = Math.atan2(targetY - y, targetX - x);
      const speed = randomRange(150, 230) + step * 28;
      spawnBullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, "#ff6245", 5.6);
    }

    function spawnRing(step) {
      const x = randomRange(width * 0.18, width * 0.82);
      const y = randomRange(height * 0.18, height * 0.72);
      const count = Math.min(12 + step * 4, 34);
      const speed = 110 + step * 13;
      const offset = Math.random() * Math.PI * 2;

      for (let index = 0; index < count; index += 1) {
        const angle = offset + index * Math.PI * 2 / count;
        spawnBullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, "#ffe05a", 5.2);
      }
    }

    function spawnSpiral(step) {
      spiralAngle += (17 + step * 1.5) * Math.PI / 180;
      const arms = Math.min(2 + Math.floor(step / 2), 5);
      const speed = 138 + step * 14;
      const x = width / 2;
      const y = height / 2;

      for (let index = 0; index < arms; index += 1) {
        const angle = spiralAngle + index * Math.PI * 2 / arms;
        spawnBullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, "#76eaff", 5);
      }
    }

    function spawnBullet(x, y, vx, vy, color, radius) {
      bullets.push({ x, y, vx, vy, color, radius });
    }

    function updateBullets(gameDelta) {
      for (let index = bullets.length - 1; index >= 0; index -= 1) {
        const bullet = bullets[index];
        bullet.x += bullet.vx * gameDelta;
        bullet.y += bullet.vy * gameDelta;

        if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < bullet.radius + player.radius * 0.82) {
          endGame();
          return;
        }

        if (bullet.x < -80 || bullet.x > width + 80 || bullet.y < -80 || bullet.y > height + 80) {
          bullets.splice(index, 1);
        }
      }
    }

    function updateStars(realDelta) {
      for (const star of stars) {
        star.y += star.speed * realDelta;
        if (star.y > height + 8) {
          star.y = -8;
          star.x = Math.random() * width;
        }
      }
    }

    function updateHud() {
      const minutes = Math.floor(elapsed / 60);
      const seconds = Math.floor(elapsed % 60);
      timeLabel.textContent = `Time ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      levelLabel.textContent = `Level ${difficultyStep() + 1}`;
      slowFill.style.transform = `scaleX(${slowEnergy / slowMaxSeconds})`;
    }

    function endGame() {
      gameOver = true;
      const minutes = Math.floor(elapsed / 60);
      const seconds = Math.floor(elapsed % 60);
      message.textContent = `GAME OVER\nSurvived ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}\nPress R to restart`;
    }

    function draw(slowActive) {
      context.clearRect(0, 0, width, height);
      drawStars();
      if (slowActive) {
        context.fillStyle = "rgba(98, 219, 255, 0.08)";
        context.fillRect(0, 0, width, height);
      }
      drawBullets();
      drawPlayer();
    }

    function drawStars() {
      for (const star of stars) {
        context.globalAlpha = star.alpha;
        context.fillStyle = "#b9ecff";
        context.beginPath();
        context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        context.fill();
      }
      context.globalAlpha = 1;
    }

    function drawBullets() {
      for (const bullet of bullets) {
        context.shadowColor = bullet.color;
        context.shadowBlur = 14;
        context.fillStyle = bullet.color;
        context.beginPath();
        context.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        context.fill();
      }
      context.shadowBlur = 0;
    }

    function drawPlayer() {
      context.save();
      context.translate(player.x, player.y);
      context.rotate(player.tilt);
      context.shadowColor = "#7ce9ff";
      context.shadowBlur = 18;
      context.fillStyle = "#39dfff";
      context.beginPath();
      context.moveTo(0, -28);
      context.lineTo(-26, 24);
      context.lineTo(0, 12);
      context.lineTo(26, 24);
      context.closePath();
      context.fill();

      context.shadowBlur = 0;
      context.fillStyle = "#f6fbff";
      context.beginPath();
      context.moveTo(0, -22);
      context.lineTo(-8, 14);
      context.lineTo(0, 8);
      context.lineTo(8, 14);
      context.closePath();
      context.fill();

      context.fillStyle = "#10253f";
      context.beginPath();
      context.moveTo(0, -16);
      context.lineTo(-5, 0);
      context.lineTo(5, 0);
      context.closePath();
      context.fill();
      context.restore();
    }

    function difficultyStep() {
      return Math.floor(elapsed / difficultyStepSeconds);
    }

    function readAxis(negative, positive) {
      return (keys.has(positive) ? 1 : 0) - (keys.has(negative) ? 1 : 0);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    resize();
    resetGame();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
