<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avoid</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050712;color:#f8fbff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 48% 18%,rgba(72,156,220,.16),transparent 28rem),linear-gradient(180deg,#070a17,#03040a)}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;top:18px;left:18px;display:grid;gap:6px;min-width:230px;pointer-events:none;text-shadow:0 2px 12px #000a}.time{font-size:24px;font-weight:750;line-height:1}.level{color:#bfeaff;font-size:18px;font-weight:700}.slow-row{display:flex;align-items:center;gap:8px;margin-top:4px}.gauge{width:210px;height:16px;overflow:hidden;border:1px solid #fff4;background:#fff2}.fill{width:100%;height:100%;transform-origin:left center;background:linear-gradient(90deg,#7ce9ff,#fff16b);box-shadow:0 0 18px #7ce9ff8c}.slow-label{color:#c9f5ff;font-size:13px;font-weight:800}.help{position:fixed;right:18px;bottom:16px;color:#f5faffb8;font-size:14px;font-weight:650;pointer-events:none;text-align:right;text-shadow:0 2px 12px #000c}.center{position:fixed;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;text-align:center}.message{white-space:pre-line;color:#fff;font-size:clamp(28px,5vw,54px);font-weight:850;line-height:1.25;text-shadow:0 6px 26px #000c}
</style></head><body><canvas id="game" aria-label="Avoid bullet hell game"></canvas><div class="hud"><div id="time" class="time">Time 00:00</div><div id="level" class="level">Level 1</div><div class="slow-row"><div class="gauge"><div id="slowFill" class="fill"></div></div><div class="slow-label">SLOW</div></div></div><div class="help">Arrow keys move<br>Hold Space to slow time<br>R starts / restarts</div><div class="center"><div id="message" class="message"></div></div><script>
const canvas=document.getElementById('game'),context=canvas.getContext('2d'),timeLabel=document.getElementById('time'),levelLabel=document.getElementById('level'),slowFill=document.getElementById('slowFill'),message=document.getElementById('message');
const keys=new Set(),bullets=[],stars=[],player={x:0,y:0,radius:13,speed:360,tilt:0};let width=0,height=0,dpr=1,lastTime=performance.now(),elapsed=0,slowEnergy=1,edgeTimer=0,ringTimer=1.8,spiralTimer=.2,spiralAngle=0,invincibleUntil=0,itemTimer=0,invincibleItem=null,gameState='ready';const difficultyStepSeconds=30,slowMaxSeconds=1,slowScale=.28,slowRechargePerSecond=.38,invincibleSeconds=2;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='KeyR')startGame()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('resize',resize);
function resize(){dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));width=innerWidth;height=innerHeight;canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);context.setTransform(dpr,0,0,dpr,0,0);if(!stars.length)createStars();player.x=clamp(player.x||width/2,player.radius,width-player.radius);player.y=clamp(player.y||height*.72,player.radius,height-player.radius);if(gameState!=='playing')centerPlayer()}
function createStars(){for(let i=0;i<110;i++)stars.push({x:Math.random()*width,y:Math.random()*height,size:.8+Math.random()*2.2,speed:18+Math.random()*66,alpha:.25+Math.random()*.62})}
function prepareGame(){bullets.length=0;elapsed=0;slowEnergy=slowMaxSeconds;edgeTimer=0;ringTimer=1.8;spiralTimer=.2;spiralAngle=0;invincibleUntil=0;itemTimer=randomItemDelay();invincibleItem=null;gameState='ready';centerPlayer();player.tilt=0;updateHud();message.textContent='AVOID\nPress R to start'}
function startGame(){bullets.length=0;elapsed=0;slowEnergy=slowMaxSeconds;edgeTimer=0;ringTimer=1.8;spiralTimer=.2;spiralAngle=0;invincibleUntil=0;itemTimer=randomItemDelay();invincibleItem=null;gameState='playing';centerPlayer();player.tilt=0;updateHud();message.textContent=''}function centerPlayer(){player.x=width/2;player.y=height/2}
function frame(now){const realDelta=Math.min(.033,(now-lastTime)/1000);lastTime=now;if(gameState==='playing'){const wantsSlow=keys.has('Space')&&slowEnergy>0,gameDelta=realDelta*(wantsSlow?slowScale:1);elapsed+=realDelta;updateSlowEnergy(realDelta,wantsSlow);movePlayer(realDelta);updateSpawners(gameDelta);updateInvincibleItem(realDelta);updateBullets(gameDelta);updateHud()}updateStars(realDelta);draw(wantsSlowActive());requestAnimationFrame(frame)}function wantsSlowActive(){return gameState==='playing'&&keys.has('Space')&&slowEnergy>0}
function updateSlowEnergy(dt,wantsSlow){slowEnergy=wantsSlow?Math.max(0,slowEnergy-dt):Math.min(slowMaxSeconds,slowEnergy+dt*slowRechargePerSecond)}
function movePlayer(dt){const dx=axis('ArrowLeft','ArrowRight'),dy=axis('ArrowUp','ArrowDown'),len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len,moving=dx!==0||dy!==0,speed=moving?player.speed:0;player.x=clamp(player.x+nx*speed*dt,player.radius,width-player.radius);player.y=clamp(player.y+ny*speed*dt,player.radius,height-player.radius);player.tilt+=((moving?-nx*.32:0)-player.tilt)*Math.min(1,dt*12)}
function updateSpawners(dt){const step=difficultyStep(),edgeInterval=Math.max(.09,.42-step*.045),edgeShots=Math.min(1+Math.floor(step/2),5);edgeTimer-=dt;while(edgeTimer<=0){edgeTimer+=edgeInterval;for(let i=0;i<edgeShots;i++)spawnEdgeBullet(step)}if(step>=1){ringTimer-=dt;if(ringTimer<=0){ringTimer=Math.max(1.05,2.4-step*.18);spawnRing(step)}}if(step>=2){spiralTimer-=dt;if(spiralTimer<=0){spiralTimer=Math.max(.08,.18-step*.01);spawnSpiral(step)}}}
function updateInvincibleItem(dt){if(elapsed<difficultyStepSeconds)return;if(invincibleItem){invincibleItem.life-=dt;if(Math.hypot(invincibleItem.x-player.x,invincibleItem.y-player.y)<invincibleItem.radius+player.radius){invincibleUntil=elapsed+invincibleSeconds;invincibleItem=null;itemTimer=randomItemDelay();return}if(invincibleItem.life<=0){invincibleItem=null;itemTimer=randomItemDelay()}return}itemTimer-=dt;if(itemTimer<=0)spawnInvincibleItem()}
function spawnInvincibleItem(){invincibleItem={x:rand(width*.15,width*.85),y:rand(height*.16,height*.82),radius:15,life:7}}function randomItemDelay(){return rand(9,15)}
function spawnEdgeBullet(step){const margin=40,side=Math.floor(Math.random()*4);let x=0,y=0;if(side===0){x=-margin;y=Math.random()*height}else if(side===1){x=width+margin;y=Math.random()*height}else if(side===2){x=Math.random()*width;y=-margin}else{x=Math.random()*width;y=height+margin}const scatter=Math.max(8,44-step*5),tx=player.x+rand(-scatter,scatter),ty=player.y+rand(-scatter,scatter),angle=Math.atan2(ty-y,tx-x),speed=rand(150,230)+step*28;spawnBullet(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed,'#ff6245',5.6)}
function spawnRing(step){const x=rand(width*.18,width*.82),y=rand(height*.18,height*.72),count=Math.min(12+step*4,34),speed=110+step*13,offset=Math.random()*Math.PI*2;for(let i=0;i<count;i++){const a=offset+i*Math.PI*2/count;spawnBullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed,'#ffe05a',5.2)}}
function spawnSpiral(step){spiralAngle+=(17+step*1.5)*Math.PI/180;const arms=Math.min(2+Math.floor(step/2),5),speed=138+step*14,x=width/2,y=height/2;for(let i=0;i<arms;i++){const a=spiralAngle+i*Math.PI*2/arms;spawnBullet(x,y,Math.cos(a)*speed,Math.sin(a)*speed,'#76eaff',5)}}function spawnBullet(x,y,vx,vy,color,radius){bullets.push({x,y,vx,vy,color,radius})}
function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-player.x,b.y-player.y)<b.radius+player.radius*.82){if(isInvincible())bullets.splice(i,1);else{endGame();return}}else if(b.x<-80||b.x>width+80||b.y<-80||b.y>height+80)bullets.splice(i,1)}}
function updateStars(dt){for(const s of stars){s.y+=s.speed*dt;if(s.y>height+8){s.y=-8;s.x=Math.random()*width}}}function updateHud(){const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);timeLabel.textContent=`Time ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;levelLabel.textContent=`Level ${difficultyStep()+1}`;slowFill.style.transform=`scaleX(${slowEnergy/slowMaxSeconds})`}
function endGame(){gameState='gameover';const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);message.textContent=`GAME OVER\nSurvived ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}\nPress R to restart`}
function draw(slowActive){context.clearRect(0,0,width,height);drawStars();if(slowActive){context.fillStyle='rgba(98,219,255,.08)';context.fillRect(0,0,width,height)}drawInvincibleItem();drawBullets();drawPlayer()}function drawStars(){for(const s of stars){context.globalAlpha=s.alpha;context.fillStyle='#b9ecff';context.beginPath();context.arc(s.x,s.y,s.size,0,Math.PI*2);context.fill()}context.globalAlpha=1}function drawBullets(){for(const b of bullets){context.shadowColor=b.color;context.shadowBlur=14;context.fillStyle=b.color;context.beginPath();context.arc(b.x,b.y,b.radius,0,Math.PI*2);context.fill()}context.shadowBlur=0}
function drawInvincibleItem(){if(!invincibleItem)return;const pulse=1+Math.sin(performance.now()*.009)*.1;context.save();context.translate(invincibleItem.x,invincibleItem.y);context.scale(pulse,pulse);context.shadowColor='#9cff5f';context.shadowBlur=24;context.fillStyle='#9cff5f';context.beginPath();context.arc(0,0,invincibleItem.radius,0,Math.PI*2);context.fill();context.shadowBlur=0;context.strokeStyle='#f7ffd7';context.lineWidth=3;context.beginPath();context.arc(0,0,invincibleItem.radius+5,0,Math.PI*2);context.stroke();context.fillStyle='#17340f';context.font='bold 18px system-ui';context.textAlign='center';context.textBaseline='middle';context.fillText('I',0,1);context.restore()}
function drawPlayer(){context.save();context.translate(player.x,player.y);context.rotate(player.tilt);if(isInvincible()){context.strokeStyle='rgba(156,255,95,.9)';context.lineWidth=4;context.shadowColor='#9cff5f';context.shadowBlur=22;context.beginPath();context.arc(0,0,38,0,Math.PI*2);context.stroke();context.shadowBlur=0}context.shadowColor='#7ce9ff';context.shadowBlur=18;context.fillStyle='#39dfff';context.beginPath();context.moveTo(0,-28);context.lineTo(-26,24);context.lineTo(0,12);context.lineTo(26,24);context.closePath();context.fill();context.shadowBlur=0;context.fillStyle='#f6fbff';context.beginPath();context.moveTo(0,-22);context.lineTo(-8,14);context.lineTo(0,8);context.lineTo(8,14);context.closePath();context.fill();context.fillStyle='#10253f';context.beginPath();context.moveTo(0,-16);context.lineTo(-5,0);context.lineTo(5,0);context.closePath();context.fill();context.restore()}function difficultyStep(){return Math.floor(elapsed/difficultyStepSeconds)}function isInvincible(){return elapsed<invincibleUntil}function axis(n,p){return(keys.has(p)?1:0)-(keys.has(n)?1:0)}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function rand(min,max){return min+Math.random()*(max-min)}resize();prepareGame();requestAnimationFrame(frame);
</script></body></html>
